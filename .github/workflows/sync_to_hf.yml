name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Prepare fresh codebase (Remove large media & history)
        run: |
          # Delete the large video files from the runner so they aren't sent to HF
          rm -rf docs/demo-screenshots/*.mp4
          rm -rf docs/demo-screenshots/*.webp
          
          # Nuke the heavy git history
          rm -rf .git
          
          # Initialize a fresh, lightweight git repo just for Hugging Face
          git config --global user.email "bot@example.com"
          git config --global user.name "Deploy Bot"
          git init
          git branch -M main
          git add .
          git commit -m "Automated lightweight deployment to Hugging Face"

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Rohet13:$HF_TOKEN@huggingface.co/spaces/Rohet13/WorldCup-OS main