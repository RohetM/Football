name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Prepare fresh codebase (Remove large media & history)
        run: |
          # Delete ALL media files from the runner so HF doesn't complain about binaries
          rm -rf docs/demo-screenshots/*.mp4
          rm -rf docs/demo-screenshots/*.webp
          rm -rf docs/demo-screenshots/*.png
          rm -rf docs/demo-screenshots/*.jpg
          rm -rf docs/demo-screenshots/*.jpeg
          
          # Dynamically inject Hugging Face configuration to the top of the README
          cat << 'EOF' > hf_header.md
          ---
          title: WorldCup OS
          emoji: ⚽
          colorFrom: blue
          colorTo: green
          sdk: docker
          pinned: false
          ---
          
          EOF
          cat README.md >> hf_header.md
          mv hf_header.md README.md
          
          # Nuke the heavy git history
          rm -rf .git
          
          # Initialize a fresh, lightweight git repo just for Hugging Face
          git config --global user.email "bot@example.com"
          git config --global user.name "Deploy Bot"
          git init
          git branch -M main
          git add .
          git commit -m "Automated lightweight deployment to Hugging Face"

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Rohet13:$HF_TOKEN@huggingface.co/spaces/Rohet13/WorldCup-OS main